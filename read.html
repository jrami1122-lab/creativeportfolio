<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Original stories and poems by Jose W. Ramirez."><title>Reading Library — Jose W. Ramirez</title><style>:root{--bg:#f7f8f5;--ink:#203047;--muted:#62717c;--green:#276b5a;--line:#e0e6e0}*{box-sizing:border-box}body{background:var(--bg);margin:0;color:var(--ink);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:3px}.wrap{max-width:850px;margin:auto;padding:0 22px}header{border-bottom:1px solid var(--line);background:#ffffffc9}header .wrap{padding-top:19px;padding-bottom:19px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:800}.brand small{display:block;font-size:.67rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}.link{font-weight:700;color:var(--green);font-size:.9rem}h1{font:500 clamp(2.7rem,6vw,4.6rem)/1.12 Georgia,serif;letter-spacing:-.04em;margin:10px 0 18px}.heading{padding:55px 0 30px}.tag{font-size:.73rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}.sub{font-size:1.1rem;color:var(--muted)}.paper{padding:clamp(23px,6vw,68px);border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 15px 35px #2436420c;margin-bottom:70px}.manuscript-prose{font:1.13rem/1.87 Georgia,"Times New Roman",serif;color:#2d333b;overflow-wrap:break-word}.manuscript-prose p{margin:0 0 1.2em;line-height:inherit}.manuscript-prose p:last-child{margin-bottom:0}.manuscript-prose .dialogue{margin-bottom:.65em}.manuscript-prose .scene-break{text-align:center;font-style:italic;letter-spacing:.06em;margin:2em 0}.manuscript-prose .stage-direction{font-style:italic}.manuscript-poetry{white-space:pre-wrap;overflow-wrap:break-word;font:1.08rem/1.85 Georgia,"Times New Roman",serif;margin:0;color:#2d333b;text-align:left;max-width:100%}.paper{min-width:0}.back{display:block;margin:30px 0;color:var(--green);font-size:.88rem;font-weight:800}.footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:.85rem}@media(max-width:580px){.manuscript-prose,.manuscript-poetry{font-size:1rem;line-height:1.8}.heading{padding-top:36px}}</style></head><body><header><div class="wrap"><a class="brand" href="index.html">Jose W. Ramirez<small>Literary Works</small></a><a class="link" href="literary.html">All writing →</a></div></header><main class="wrap"><a class="back" href="literary.html">← Literary Works</a><section class="heading"><div class="tag" id="type">Original writing</div><h1 id="title"></h1><p class="sub" id="subtitle"></p></section><article class="paper"><div id="manuscript"></div></article></main><footer class="footer"><div class="wrap">© Jose W. Ramirez · Original stories and poetry.</div></footer><script>
const works={"ouija":"It was a late summer night, somewhere around 10 PM; the boys had been anticipating this night for an entire week. And it was the perfect night – as it was the end of summer, there was a cool breeze, the night had an eerie aura with a quiet stillness that made it clear most kids were starting to settle in at home to welcome the school year. Not these boys; there were the younger ones, Anthony (16), David (15), and Josh (13). Then there were the older ones, Carmelo (20), and Harry (21). Carmelo asked the group, “You guys ready?”\n\nA week earlier, it had all started with a random conversation that took a spin around the topic of horror movies, and the coming of Fall, with it – Halloween. Carmelo had asked everyone if they had ever played the Ouija board; of everyone in the group, he had only played with Harry before. None of the others had, but they were intrigued.\n\n“A Luigi board?” Josh asks, “what’s that?”\n\n“Not a Luigi board, an Ooo-wee-gee board” He responds, as if to emphasize strange pronunciation, unlike any common word in the English dictionary. “It’s a board that lets you talk to ghosts; you ask them whatever you like and they answer you.”\n\n“Can you see them?” Anthony chimed in.\n\n“No dummy, you can’t see them. It’s a board!” Carmelo continues explaining the game, if you would call it that. “It has all the letters of the alphabet, it has yes, no and maybe and it moves a glass around the board. You have to read the letters it stops at.”\n\n“Ooo, I want to try it” says David, the little daredevil always volunteered for the more extreme activities.\n\n“We should!” Carmelo smiles at Harry and gives him a wink.\n\n“But when? And where? It’s already late.” Anthony states.\n\n“It would have to be next weekend, it’s over at my house and I’m not going over there to get it now.” Carmelo pauses, “maybe we can play in the abandoned building” he says with a grin, pointing toward the abandoned, boarded up townhouse, two townhouses away.\n\nCarmelo couldn’t hide his excitement, he is the alternative goth in the group, dresses in all black, wears a lot of spikes from his jewelry to his hair; moved by anything horror, he spends a lot of his time sketching his favorite horror characters.\n\n“We can’t go in there” says Harry, “plus they have that big dog in there guarding the place. We can use my place.”\n\n“Your place?” Carmelo asks, “the cellar?” He grins again.\n\n“Yeah” Harry replies.\n\n“Let’s do it, that cellar is pretty much an abandoned house” Carmelo jokes.\n\nHarry has been working on building a den in his cellar, the ceilings are short, it’s dark, and still needs a lot of work. The perfect setting for the Ouija board.\n\n“I don’t know” says Josh with the look of worry upon his face “this sounds scary.”\n\n“Don’t worry Josh, if it gets to be too much, we’ll just leave”  says Anthony, comforting his little brother.\n\n“Great!” says Carmelo, “This is gonna be fun” he says with a large smile across his face, showing half excitement and full creepy to the rest of the group.\n\nOne Week Later    -\n\n“You guys ready?” Carmelo asks as he pulls the Ouija board out of his black backpack and lays it on Harry’s dusty table,\n\n“Almost, David should be getting here any minute now.” Anthony answered.\n\n“That's cool,” says Harry, someone upstairs will let him in. “Melo remember the last time we played?”\n\nCarmelo answers “Of course, I can’t wait to see what’s out there tonight.” He says with a wink back at Harry.\n\nHarry smiles “You know the deal.”\n\nThe wooden stairs creak as the footsteps thump on their way down. David turns at the base of the stairway, swatting away spiderwebs he must have felt hit his face on the way down. “Wassup guys!?”\n\nUnsynchronized greetings come from the group of friends, Harry adds on “Who let you in?”\n\n“Gladys” he replies, Harry's little sister.\n\n“Cool. Is that everybody?” Harry asks the group as he glances around.\n\nCarmelo replies, “I think so.”\n\nEveryone huddles around a small round wooden table, whether it’s on a chair, a crate, a step ladder, everyone is seated. A cool draft can be felt in the cellar, an old, rusted drop door leading straight outside had open airway at the seams. To further set the mood for the occasion, Harry cuts off the light bulb that only faintly illuminated the cellar and lights a candle; as Carmelo undid the box containing the Ouija board.\n\nCarmelo, leaning over the board, calls everyone in to learn the rules of the game. “Bring it in guys – In Ouija, everyone must hold the glass together and we start the spin as we ask the question using our voice, we will each take a turn – clockwise. After the question, the ghost should take over and answer us using the board. Sounds easy enough?”\n\nHe glances up, noticing the orange glow that shone upon their faces in an otherwise dark room, Josh staring wide eyed and petrified.\n\nAnthony says, “Yep, I think we got it.”\n\n“First, we have to call to it and get it to respond to us. I'll start us out.” Carmelo begins, “Hi, my name is Melo, I'm looking to make contact with a spiritual being. Anybody out there?”\n\nThe group of five, each with their arms stretched over the table  toward the center–  held the glass up, a few inches over the board, and spun it in circular motion. “When you guys feel the ghost start moving the piece stop forcing it, just gently keep your fingers on the piece and let the ghost take over” Carmelo says softly, tossing a smirk at Harry, before repeating the question, “I am looking to make contact with a spiritual being, anybody out there?”\n\nThe circular motion continues until the piece begins to shift; the younger boys gasp, not breaking contact with the instrument, as it leans and hovers over the word:\n\nGhost: “YES”\n\nAnthony: “How many of you are there?”\n\nGhost: “JUST ME”\n\nJosh: “Can you see us?”\n\nGhost: “YES – I AM IN THE ROOM”\n\n*Josh looks around the room frightenedly*\n\nHarry: “Where in the room are you?”\n\nGhost: “STANDING OVER YOU”\n\n*The younger boys gasp again*\n\nDavid: “How long have you been here?”\n\nGhost: “105 YEARS”\n\nCarmelo: “Can you give a sign to show us that you’re in here?”\n\nGhost: “ WHAT WOULD Y-“\n\nThe silence is broken by a tumbling sound in the background, as the piece shakes in the boys’ hand breaking free from their grasp, falling onto the board.\n\n“Jesus Christ, what was that!?” Says David turning to look behind him toward the sound.\n\n“I don’t think it’s wise to use Jesus’ name while playing the Ouija Board,” says Harry.\n\n“No, I disagree, we can probably use his help right now,” David responds while holding a hand against his chest.\n\n“I think it was The Cat, he might have jumped on the dresser again, I’m always telling it not to,” Harry says. He had recently bought a cat, a little over a month ago, to keep mice at bay while he cleans up the cellar. He named it The Cat, rough looking and not necessarily a kitten, this cat resembled an alley cat all the other cats would be afraid of. He never planned to bond with it; it’s more like mouse patrol.\n\nThe boys turn their attention back toward the game, Carmelo wanting a retry on his turn. Glass piece back in spinning motion.\n\nCarmelo: “Did you cause that tumbling sound?”\n\nGhost: “NO”\n\nAnthony: “Can you prove that you’re here or are you completely worthless?”\n\nGhost: “A JOKER, I CAN READ YOUR FATE”\n\nJosh: “What do you mean?”\n\nGhost: “ANTHONY WILL DIE WITHIN FIVE YEARS”\n\nJosh turns to his older brother “he knows your name.” Anthony sucking his teeth gives off a soft nervous laugh.\n\nHarry: “How about a sign, by making something happen or move in this room?”\n\n*The candlelight waves and flickers*\n\nGhost: “I REALLY DO NOT LIKE BEING DISTURBED”\n\nDavid: “That was creepy – Can you get us another ghost who wants to play along?”\n\nGhost: “NO”\n\nCarmelo: “So what can you do?”\n\nGhost: “WHO IS ANNA?”\n\n*The boys look at each other, then to David in confusion*\n\nAnthony: “Anna is David’s girlfriend. Why?”\n\nGhost: “SHE IS VERY DECEI-“\n\nBefore finishing its sentence, the piece gives another shake, breaking away from the boys’ grasp and on to the board. David’s phone, which was lying on the table, lights up and begins to vibrate. “It’s Anna” he says as he goes to answer. “Hello?” Her murmurs can be heard by everyone in the dark, quiet cellar; David signals to his friends he will take the call to the opposite side of the Cellar.\n\nThe boys decide they will continue without David until he returns, after discussing how freaky and coincidental that was. Back to the board, the piece in circular motion. Harry volunteers to pick up where they left off.\n\nHarry: “Did you know that Anna was going to call?”\n\nGhost: “YES”\n\n*Harry excuses himself and goes upstairs*\n\nCarmelo: “Did you mean to say Anna is very deceitful?”\n\nGhost: “Yes”\n\nAnthony: “Can you give us another sign of your presence here with us?”\n\nGhost: “I SAID NO. CONTINUE AND I WILL GO FOR THE LITTLE ONE”\n\nJosh: *nervously* “Are you talking about me?”\n\nThe piece breaks from their grasp again as a loud resounding “YES!” echoes over the cellar, a deep voice. Most of the group jump in shock, Josh filled with fear turns to his brother, “I don’t want to play anymore.”\n\nAnthony assures him “Just a little while longer, don’t worry I’m here.”\n\nJosh insists on the verge of tears “No, I want to go home.”\n\nDavid returning from his phone call, “what’s going on here? Everything alright?”\n\nCarmelo answers “I don’t know, I think we’re going to wrap this up. Everything alright with you? With Anna?”\n\nDavid responds “Yeah. It’s Ok. Kinda odd that she called when she did.”\n\nAnthony adds in “Yeah that was freaky, anyway we’re heading out.”\n\nThe boys share their goodbyes; the younger ones make their way up the stairs toward the front door, passing Harry on his way back down.\n\nWith the younger ones away now, the older guys discuss the game. Carmelo starts “Whoa that was good! Good move on the ‘YES!’  that was powerful!” he reaches over for a high five.\n\nHarry responds “Yeah. I don’t know man, I felt it coming and thought this is my moment.” He continues “David’s girl calling when she did was spooky as hell.”\n\nCarmelo agrees as he says goodbye, making an exit with the Ouija board in hand, leaving Harry to shut down the cellar before heading upstairs to his room.\n\nThis game was intriguing; as always, I enjoyed watching it. I have gathered enough information and material to work with. The only hard part is who do I start with – they’re all game and interesting enough to mess with. Maybe I will start with Harry, for the loud ‘YES!’ It is true I really don’t like to be disturbed. The game is fun; the noises are not. I will enjoy this, I will disturb them, the way they have disturbed me. Anthony shouldn’t have to wait five years to die. Josh? The little one? I have lost the ability to smell, but not to sense and I can sense his fear. David and Anna can use a little disturbance when they think they’re alone. Oh, and Carmelo, I like him, I can use him my team, only death can turn him. I will haunt them all.\n\n*A chilling, hollow and deep menacing laugh lingers in the dark cellar.*","wela":"Wondering Wela\n\n        The day is typical for early fall; the warmth of the summer hasn’t fully escaped us but\nwe’ve yet to return to standard time. It’s Friday, and we’re just ending the school week. As if it\nwere my duty, I rush through my homework to go outside. “Your father is going to talk to you\nlater,” my mother says before I step out the door. Not fully concerned, but curiosity slows me\ndown. Talk to me about what? I don’t ask; I let the words slip by, maybe it’s not too bad, if it is,\nmaybe he’ll forget. “Oh, okay,” I say abruptly as I make my exit. My father would come by\naround 4:00 PM every school day to see my brothers and me; today is no different; here he is, in\nhis blue Denali.\n\n        He doesn’t seem very happy.\n        “Jun, come inside. Jose, Will… go upstairs, I’ll call you down in a bit,” he says as our\nbodies hang over his open car windows.\n        The windows come up as I shut the door behind me and I hear the doors lock. This is\ngoing to be a serious conversation.\n        “Your mother tells me you kicked the lady’s trash over, across the street…”\n        “What lady?” I reply.\n        “Jun. Don’t play. You’re 14, not a child anymore. You tell me what lady.”\n        “I… uh. I don’t…” I stammer.\n        “You do know all the parents on this block talk to each other, right? Even though I don’t\nlive here anymore, they still tell me everything – when it comes to you guys. I make sure they\ndo.”\n        “I’m sorry, pa. Everyone was doing it.”\n        “I don’t want to hear what everyone is doing,” he says. “We are talking about you.”\n        “Okay, Pa,” I surrender.\n        “How would you like it if someone did that to our house, and I had to clean it up?” he\ncontinues. “Or better yet, I had you clean it?”\n\n        I stare out the window. I already know this conversation isn’t going to leave any room for\nme to defend myself. I have no defense. Sometimes when my friends and I get together, we do\nstupid things. Boredom, maybe?\n\n        He goes on, “I better never hear of it again, your mother told me this time, but I’m going\nto knock on her door and make sure she has my number so she can call me directly if you step\nout of line. Any of you guys!”\n        “I want you to do something for me,” he states.\n        “What’s that?” I ask.\n        “I want you to pick somebody. Anybody. It could be family; it doesn’t have to be. Pick\nsomebody you love, someone you have admiration for whose respect you’d never want to lose.\nTake a minute.”\n\n        He leaves me time to think, but I’ve already chosen his mother, my grandmother. She is\neasily the obvious choice. She is the matriarch of our family, the one who holds the recipes, the\none that encourages everyone to call one another, the one who hosts the sleepovers during family\nreunions. Every time we passed by to see her, we would have to pedir la bendición and then she\nwould give us her blessing. She always cooks for us and likes to surprise us with our favorite\nDominican dishes, like habichuela con dulce, or moro de coco. I let the quiet rest for a while; I\ndon’t want to disturb it or make the moment any more tense.\n\n         “Who’d you pick?” he asks.\n         “Wela.” I don’t have to specify which one. He must know I’d pick her.\n         “Ok. I want you to – next time you are out here and thinking about doing anything\nquestionable – I want you to think of your grandmother. I want you to imagine she was turning\nthe corner or entering the room as you’re doing whatever it is that you’re thinking about doing.”\nHe continues, “I want you to imagine her catching you in the act and how that would make her\nfeel, to see you kicking over the neighbors’ trash can. Or whatever else it is that you’re doing out\nhere.”\n         “Does that make you feel good?” he asks.\n         “No…”\n         “That’s something to think about. Why doesn’t it feel good?”\n         Silence.\n         “That’s a question for you to answer,” he presses.\n         “I don’t know…” I reply.\n         “Because it’s something you know you shouldn’t be doing,” he finishes. After a quick\nmoment of silence, “Go upstairs, stay inside today, tell your brothers to come down.”\n         “Bye, Pa.” I open the door of the SUV to exit.\n         “Hey Jun.”\n         “Yeah, Pop?”\n         “I love you.”\n         “Love you too,” I respond as I step out, closing the door behind me.\n\n        This lecture felt like a normal lecture, like the kinds we’d get when we’d come home\nwith unfavorable grades, or if we made a mess in the house – but I had no idea that this thought\nexercise – his words and the image of my grandmother – would carry on the way it did. Carry on\nthrough years of growth, acting as a buffer to many of my decisions through life, especially as I\nexplored young adulthood. I am grateful for his words because they helped me practice self-\naccountability at times when I had no one to turn to and had to make decisions based on my own\njudgment. I’d just think, how would my grandmother feel about this decision? I couldn’t imagine\nletting her down. What would happen then, when I say bendición? Would she not reply, “Que\nDios te bendiga?”\n\n       “Jose. Will. Pops is calling for you.”","ark":"Into the Ark\n\n\n\nHere comes the tsunami\n\nBefore the flood arrives\n\nInto the ark…\n\n      All you movies and games\n\n      And all entertainment that helps me stay sane\n\n      All the days filled with random\n\n      Cars blasting music, like its their favorite anthem\n\n      Strangers interacting and smiling\n\n      That feeling you get when you go outside stylin’\n\n      The natural sense of surprise\n\n      The light shine upon your face as you watch the sunrise\n\n      All of your hopes and dreams\n\n      The hope that it’s true, everything isn’t what it seems\n\nHere comes the tsunami\n\nBefore the flood arrives\n\nInto the ark\n\nAll that makes you feel alive.","astral":"Astral Dreams\n\n        I often think that multiple realities run in coexistence\n\n  Many realities in which we are present in an alternate experience\n\n               A different reality, a different dimension\n\n         But there we are, living there as a different person,\n\n    The us we would have been, had we made THAT other choice\n\n The choice where we decided to speak up, where we took a chance\n\n     Took that job, went to that school, asked that girl to dance\n\n  Every choice we didn’t make, that could have opened new paths\n\nOccurred in these realities, and we are there presenting in new masks\n\nSometimes we communicate with these other realms, it would seem\n\n       As we are given glimpses of these other lives in dreams\n\n  It has been more than fifteen years since I gave up my aspirations\n\n      And thirty years since I crawled into a play space station\n\n         But when I was young, I wanted to be an astronaut\n\n           Until high school, my grades said I ought to not\n\n        But recently I dreamed that I was aboard a spaceship\n\n                  A dream so vivid I can still taste it\n\n    The liquid meal with my crew I didn’t know would be my last\n\n    Some were dressed up, some dressed down, in gym apparel\n\n          Some in military uniform, commanders in battle\n\n            The vibe is chill, like the night’s winding down\n\n           Except for the uniformed people pacing around\n\n               I watched them; they seemed to be on high alert\n\n          I decided to turn toward my cabin, but he caught me first\n\n          “General, great job, today was a success, I’m turning in”\n\n   “Get dressed? Why? There are no tasks set for the rest of the evening”\n\n           “Oh, simulations? Sure, I’ll meet you in the ready room”\n\n              Seems urgent I guess I’d be best to get ready soon\n\n             I put on my astronaut gear and met with the general\n\n            I felt a bit anxious; I didn’t know what I was headed to\n\n                  In the ready room, with little conversation\n\n      He directed me as we walked together toward the docking station\n\n                 “Wait in here” he says, “standby for orders”\n\n           We’re in the middle of nowhere, suddenly I need water\n\n        First, I heard the buzzer, then the decompression at the hatch\n\n            I turned toward the exit and tried to reach for the latch\n\n           But it’s too late, like a vacuum, the deep consumed me\n\n                 Out of the ship, no O2 tank, no crew, just me\n\n                     It all happened so fast, this isn’t right\n\n             But it must have been the longest minute in my life\n\nI wrestled with the little oxygen in my suit until “CRACK!” There goes my mask\n\n          My consciousness fades away until I wake up with a gasp\n\n      I interpreted the dream as a look into a parallel realm of existence\n\n         Where on this very night, in that reality, in this very instance\n\n  I took my last breath, had I made THAT choice, had I gone down that line\n\n        I thanked God that we are always where we are meant to be,\n\n               and in this reality, he has granted me more time.","noah":"Noah’s Ark- The Poem\n\nI’m going to need a guiding light\n\nTo guide us through the dark\n\nFeels like it was only last night\n\nI had a dream about the Ark\n\n\n\nYes, the one with the animals in pairs\n\nThe one that survived the flood\n\nThere are so many things that we share\n\nDown to the DNA in our blood\n\n\n\nI’m new to this but so are you\n\nIn fact, I am much older\n\nI’ll do anything to get us through\n\nAnd you will always have my shoulder\n\n\n\nSo, listen here bears, tigers— and constricting boas\n\nMake some room in this Ark and welcome my son Noah.","heaven":"Heaven II\n\n              You wake up to notice all your windows are open\n\n                  The clock isn’t ticking, perhaps it’s broken\n\n             Look outside, blue skies, white clouds, soft as cotton\n\n         You walk to the window to an array of colorful buildings and\n\n                Wow! Look at that! More clouds at the bottom\n\n                       No streets, no sidewalks, no cars\n\n                      No schools, no hospitals, no bars!\n\n              “Look out, here I come! Hi, it’s nice to meet you”\n\n              “Can you see me standing here at your window?”\n\n                  “You must be wondering how am I flying”\n\n                    “You can too, if I’m lying, I’m dying”\n\n                      “Hah! Too late! Don’t you get it?”\n\n              Come outside, so I can show you around heaven”","rapture":"Into the Ark\n\n\n\nHere comes the tsunami\n\nBefore the flood arrives\n\nInto the ark…\n\n       All you movies and games\n\n       And all entertainment that helps me stay sane\n\n       All the days filled with random\n\n       Cars blasting music, like its their favorite anthem\n\n       Strangers interacting and smiling\n       That feeling you get when you go outside stylin’\n\n       The natural sense of surprise\n\n       The light shine upon your face as you watch the sunrise\n\n       All of your hopes and dreams\n\n       The hope that it’s true, everything isn’t what it seems\n\nHere comes the tsunami\n\nBefore the flood arrives\n\nInto the ark\nAll that makes you feel alive.\n\n\n                        Noah’s Ark- The Poem\n\n\n                    I’m going to need a guiding light\n                      To guide us through the dark\n                     Feels like it was only last night\n                      I had a dream about the Ark\n\n\n                  Yes, the one with the animals in pairs\n                     The one that survived the flood\n                 There are so many things that we share\n                     Down to the DNA in our blood\n\n\n                     I’m new to this but so are you\n                        In fact, I am much older\n                    I’ll do anything to get us through\n                 And you will always have my shoulder\n\n\n           So, listen here bears, tigers— and constricting boas\n         Make some room in this Ark and welcome my son Noah.\n\n\nAstral Dreams\n\n\nI often think that multiple realities run in coexistence\nMany realities in which we are present in an alternate experience\nA different reality, a different dimension\nBut there we are, living there as a different person,\nThe us we would have been, had we made THAT other choice\nThe choice where we decided to speak up, where we took a chance\nTook that job, went to that school, asked that girl to dance\nEvery choice we didn’t make, that could have opened new paths\nOccurred in these realities, and we are there presenting in new masks\nSometimes we communicate with these other realms, it would seem\nAs we are given glimpses of these other lives in dreams\nIt has been more than fifteen years since I gave up my aspirations\nAnd thirty years since I crawled into a play space station\nBut when I was young, I wanted to be an astronaut\nUntil high school, my grades said I ought to not\nBut recently I dreamed that I was aboard a spaceship\nA dream so vivid I can still taste it\nThe liquid meal with my crew I didn’t know would be my last\nSome were dressed up, some dressed down, in gym apparel\nSome in military uniform, commanders in battle\nThe vibe is chill, like the night’s winding down\nExcept for the uniformed people pacing around\nI watched them; they seemed to be on high alert\nI decided to turn toward my cabin, but he caught me first\n“General, great job, today was a success, I’m turning in”\n“Get dressed? Why? There are no tasks set for the rest of the evening”\n“Oh, simulations? Sure, I’ll meet you in the ready room”\nSeems urgent I guess I’d be best to get ready soon\nI put on my astronaut gear and met with the general\n\n\nI felt a bit anxious; I didn’t know what I was headed to\nIn the ready room, with little conversation\nHe directed me as we walked together toward the docking station\n“Wait in here” he says, “standby for orders”\nWe’re in the middle of nowhere, suddenly I need water\nFirst, I heard the buzzer, then the decompression at the hatch\nI turned toward the exit and tried to reach for the latch\nBut it’s too late, like a vacuum, the deep consumed me\nOut of the ship, no O2 tank, no crew, just me\nIt all happened so fast, this isn’t right\nBut it must have been the longest minute in my life\nI wrestled with the little oxygen in my suit until “CRACK!” There goes my mask\nMy consciousness fades away until I wake up with a gasp\nI interpreted the dream as a look into a parallel realm of existence\nWhere on this very night, in that reality, in this very instance\nI took my last breath, had I made THAT choice, had I gone down that line\nI thanked God that we are always where we are meant to be,\nand in this reality, he has granted me more time.\n\nHeaven II\n\n              You wake up to notice all your windows are open\n\n                  The clock isn’t ticking, perhaps it’s broken\n\n             Look outside, blue skies, white clouds, soft as cotton\n\n         You walk to the window to an array of colorful buildings and\n\n                Wow! Look at that! More clouds at the bottom\n\n                       No streets, no sidewalks, no cars\n\n                      No schools, no hospitals, no bars!\n\n              “Look out, here I come! Hi, it’s nice to meet you”\n\n              “Can you see me standing here at your window?”\n\n                  “You must be wondering how am I flying”\n\n                    “You can too, if I’m lying, I’m dying”\n\n                      “Hah! Too late! Don’t you get it?”\n\n              Come outside, so I can show you around heaven”","luna":"Luna, mi luna si fuera el dueno de el universo\nPagare el sol, para verte brillar, dia y noche.\nRevivire los unicornios para volar en el Cielo en coche.\nTe hare un Castillo en los nubles, mi reina\nY te hare un Anillo con una estrella\nTe dedico una montana en donde escribo tu nombre\nTambien te dedico una Isla donde nos Podemos enconder\nLuna, mi luna si fuera el dueno de el universo\nTe pidare tu mano que seras mio. Solo mio."};

// Convert manuscript hard wraps into responsive reading paragraphs without rewriting the work.
function proseParagraphs(source, dropTitle=true){
 let text=String(source).replace(/\r\n?/g,'\n');
 let lines=text.split('\n');
 if(dropTitle){
   const headingIndex=lines.findIndex(line=>/^\s*(The Ouija|Wondering Wela)\s*$/i.test(line));
   if(headingIndex>=0 && headingIndex<12)lines=lines.slice(headingIndex+1);
 }
 const blocks=[];let current=[];
 function flush(){if(current.length){blocks.push(current);current=[]}}
 for(const line of lines){
   if(!line.trim()){flush();continue}
   const clean=line.trim();
   const isNew= /^\s{5,}\S/.test(line) && current.length>0 &&
      (/^[“"‘']/.test(clean) || /^(?:Ghost|Anthony|David|Manny|Josh|Harry|Carmelo|Rich|Richard)\s*:/.test(clean) ||
        /^[*]/.test(clean) || /[.!?”’*:]$/.test(current[current.length-1].trim()));
   if(isNew)flush();
   current.push(clean);
 }
 flush();
 return blocks.flatMap(lines=>{
   const joined=lines.join(' ').replace(/\s+([,.;!?])/g,'$1').trim();
   if(!joined)return [];
   return [{text:joined,kind:/^[—–-]\s*One Week Later/i.test(joined)?'scene-break':
      /^\*.*\*$/.test(joined)?'stage-direction':
      /^(?:[“"‘']|Ghost:|Anthony:|David:|Manny:|Josh:|Harry:|Carmelo:|Rich:|Richard:)/.test(joined)?'dialogue':''}];
 });
}
function renderReading(source,key,target){
 target.replaceChildren();
 if(key!=='ouija'&&key!=='wela'){
   const pre=document.createElement('pre');pre.className='manuscript-poetry';
   let poem=source.split('\n').map(line=>line.trimEnd()).join('\n').trim();
   const firstLine=poem.split('\n')[0].trim();
   const titleLine={ark:'Into the Ark',astral:'Astral Dreams',noah:'Noah’s Ark- The Poem',heaven:'Heaven II'}[key];
   if(titleLine&&firstLine===titleLine)poem=poem.slice(poem.indexOf('\n')+1).trim();
   pre.textContent=poem;
   target.append(pre);return;
 }
 target.className='manuscript-prose';
 for(const item of proseParagraphs(source)){
   const p=document.createElement('p');
   if(item.kind)p.className=item.kind;
   p.textContent=item.text;
   target.append(p);
 }
}
