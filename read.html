const works={"ouija":"                                          The Ouija\n\n        It was a late summer night, somewhere around 10 PM; the boys had been\nanticipating this night for an entire week. And it was the perfect night – as it was the end of\nsummer, there was a cool breeze, the night had an eerie aura with a quiet stillness that\nmade it clear most kids were starting to settle in at home to welcome the school year. Not\nthese boys; there were the younger ones, Anthony (16), David (15), Manny (15) and Josh\n(13). Then there were the older ones, Carmelo (20), Richard (20), and Harry (21). Carmelo\nasked the group, “You guys ready?”\n\n       A week earlier, it had all started with a random conversation that took a spin around\nthe topic of horror movies, and the coming of Fall, with it – Halloween. Carmelo had asked\neveryone if they had ever played the Ouija board; of everyone in the group, he had only\nplayed with Harry before, he plays regularly with Rich who wasn’t present. None of the\nothers had, but they were intrigued.\n\n       “A Luigi board?” Josh asks, “what’s that?”\n       “Not a Luigi board, an Ooo-wee-gee board” He responds, as if to emphasize strange\npronunciation, unlike any common word in the English dictionary. “It’s a board that lets\nyou talk to ghosts; you ask them whatever you like and they answer you.”\n       “Can you see them?” Anthony chimed in.\n       “No dummy, you can’t see them. It’s a board!” Carmelo continues explaining the\ngame, if you would call it that. “It has all the letters of the alphabet, it has yes, no and\nmaybe and it moves a glass around the board. You have to read the letters it stops at.”\n       “Ooo, I want to try it” says David, the little daredevil always volunteered for the\nmore extreme activities.\n       “We should!” Carmelo smiles at Harry and gives him a wink.\n       “But when? And where? It’s already late.” Anthony states.\n       “It would have to be next weekend, it’s over at my house and I’m not going over\nthere to get it now.” Carmelo pauses, “maybe we can play in the abandoned building” he\nsays with a grin, pointing toward the abandoned, boarded up townhouse, two townhouses\naway.\n\n       Carmelo couldn’t hide his excitement, he is the alternative goth in the group,\ndresses in all black, wears a lot of spikes from his jewelry to his hair; moved by anything\nhorror, he spends a lot of his time sketching his favorite horror characters.\n\n       “We can’t go in there” says Harry, “plus they have that big dog in there guarding the\nplace. We can use my place.”\n       “Your place?” Carmelo asks, “the cellar?” He grins again.\n       “Yeah” Harry replies.\n       “Let’s do it, that cellar is pretty much an abandoned house” Carmelo jokes.\n       Harry has been working on building a den in his cellar, the ceilings are short, it’s\ndark, and still needs a lot of work. The perfect setting for the Ouija board.\n\n       “I don’t know” says Josh with the look of worry upon his face “this sounds scary.”\n       “Don’t worry Josh, if it gets to be too much, we’ll just leave” says Anthony,\ncomforting his little brother.\n       “Great!” says Carmelo, “I will tell Rich. This is gonna be fun” he says with a large\nsmile across his face, showing half excitement and full creepy to the rest of the group.\n\n       -   One Week Later -\n\n        “You guys ready?” Carmelo asks as he pulls the Ouija board out of his black\nbackpack and lays it on Harry’s dusty table,\n        “Almost, Manny should be getting here any minute now.” David answered, “I invited\nhim.”\n        “That's cool” says Harry, “The more the merrier.” He turns to Rich “You played Ouija\nbefore?”\n        Rich answers “Yeah, a couple times with Melo.”\n        Harry smiles “So you know the deal.” He winks at Rich.\n        Rich responds, “Yeah, I got it.”\n        The wooden stairs creak as the footsteps thump on their way down. Manny turns at\nthe base of the stairway, swatting away spiderwebs he must have felt hit his face on the\nway down. “Wassup guys!?”\n        Unsynchronized greetings come from the group of friends, Harry adds on “Who let\nyou in?”\n        “Gladys” he replies, Harry's little sister.\n        “Cool. Is that everybody?” Harry asks the group as he glances around.\n        Carmelo replies, “I think so.”\n        Harry cuts off the light bulb that only faintly illuminated the cellar and lights a\ncandle; as Carmelo undid the box containing the Ouija board.\n        Carmelo, leaning over the board, calls everyone in to learn the rules of the game.\n“Bring it in guys – In Ouija, everyone must hold the glass together and we start the spin as\nwe ask the question using our voice, we will each take a turn – clockwise. After the\nquestion, the ghost should take over and answer us using the board. Sounds easy\nenough?”\n        He glances up, noticing the orange glow upon their faces, Josh staring wide eyed\nand petrified.\n        Anthony says, “Yep, I think we got it.”\n        “First, we have to call to it and get it to respond to us. I'll start us out.” Carmelo\nbegins, “Hi, my name is Melo, I'm looking to make contact with a spiritual being. Anybody\nout there?”\n        The group of seven, each with their arms stretched over the table – some extending\none arm, others two – held the glass up, a few inches over the board, and spun it in circular\nmotion. “When you guys feel the ghost start moving the piece stop forcing it, just gently\nkeep your fingers on the piece and let the ghost take over” Carmelo says softly, tossing a\nsmirk at Harry and Rich, before repeating the question, “I am looking to make contact with\na spiritual being, anybody out there?”\n\n       The circular motion continues until the piece begins to shift; the younger boys gasp,\nnot breaking contact with the instrument, as it leans and hovers over the word:\n\n\n\n       Ghost: “YES”\n       Anthony: “How many of you are there?”\n       Ghost: “JUST ME”\n       Josh: “Can you see us?”\n       Ghost: “YES – I AM IN THE ROOM”\n       *Josh looks around the room frightenedly*\n       Rich: “Where in the room are you?”\n       Ghost: “STANDING OVER YOU”\n       *The younger boys gasp again*\n       Harry: “How long have you been here?”\n       Ghost: “105 YEARS”\n       David: “Can you give a sign to show us that you’re in here?”\n       Ghost: “ WHAT WOULD Y-“\n\n         The silence is broken by a tumbling sound in the background, as the piece shakes in\nthe boys’ hand breaking free from their grasp, falling onto the board.\n         “What the heck was that!?” Says David turning to look behind him toward the\nsound.\n         “The cat” says Harry, “It must have jumped on the dresser again, I’m always telling\nit not to.” Harry recently bought a cat, a little over a month ago, to keep mice at bay while\nhe cleans up the cellar. He named it The Cat, he never planned to bond with it, it’s more\nlike mouse patrol.\n         The boys turn their attention back toward the game. Glass piece back in spinning\nmotion.\n\n       Manny: “Did you cause that tumbling sound?”\n       Ghost: “NO”\n       Carmelo: “Can you turn the light on in here?”\n       Ghost: “I WILL NOT”\n       Anthony: “Can you prove that you’re here or are you completely worthless?”\n       Ghost: “A JOKER, I CAN READ YOUR FATE”\n       Josh: “What do you mean?”\n       Ghost: “ANTHONY WILL DIE WITHIN FIVE YEARS”\n\n       Josh turns to his older brother “he knows your name.” Anthony sucking his teeth\ngives off a soft nervous laugh.\n\n     Rich: “How about a sign, by making something happen or move in this room?”\n     *The candlelight waves and flickers*\n\n     Ghost: “I REALLY DO NOT LIKE BEING DISTURBED”\n     Harry: “That was creepy – Can you get us another ghost who wants to play\n    along?”\n     Ghost: “NO”\n     David: “So what can you do?”\n     Ghost: “WHO IS ANNA?”\n     *David and Manny look at each other in confusion.*\n     Manny: “Anna is David’s girlfriend. Why?”\n     Ghost: “SHE IS VERY DECEI-“\n\n        Before finishing its sentence, the piece gives another shake, breaking away from the\nboys’ grasp and on to the board. David’s phone, which was lying on the table, lights up and\nbegins to vibrate. “It’s Anna” he says as he goes to answer. “Hello?” Her murmurs can be\nheard by everyone in the dark, quiet cellar; David signals to his friends he will take the call\nto the opposite side of the Cellar.\n        The boys decide they will continue without David until he returns, after discussing\nhow freaky and coincidental that was. Back to the board, the piece in circular motion.\n\n       Harry: “Did you know that Anna was going to call?”\n       Ghost: “YES”\n       Anthony: “Can you give us another sign of your presence here with us?”\n       *Rich excuses himself, goes upstairs*\n       Ghost: “I SAID NO. CONTINUE AND I WILL GO FOR THE LITTLE ONE”\n       Josh: *nervously* “Are you talking about me?”\n\n        The piece breaks from their grasp again as a loud resounding “YES!” echoes over\nthe cellar, a deep voice. Most of the group jump in shock, Josh filled with fear turns to his\nbrother, “I don’t want to play anymore.”\n        Anthony assures him “Just a little while longer, don’t worry I’m here.”\n        Josh insists on the verge of tears “No, I want to go home.”\n        David returning from his phone call, “what’s going on here? Everything alright?”\n        Carmelo answers “I don’t know, I think we’re going to wrap this up. Everything\nalright with you? With Anna?”\n        David responds “Yeah. It’s Ok. Kinda odd that she called when she did.”\n        Manny adds in “Yeah that was freaky, anyway I’m heading out.”\n        The boys share their goodbyes; the younger ones make their way up the stairs\ntoward the front door, passing Rich on his way back down.\n        With the younger ones away now, the older guys discuss the game. Carmelo starts\n“Whoa that was good! Good move on the ‘YES!’ Rich that was powerful!” he reaches over\nfor a high five.\n        Rich responds “Yeah. I don’t know man, I felt it coming and thought this is my\nmoment.”\n        Harry states, “David’s girl calling when she did was spooky as hell.”\n\n         The others nod in agreement, they share their final goodbyes, Rich and Carmelo\nleaving together and leaving Harry to shut down the cellar before heading upstairs to his\nroom. This game was intriguing; as always, I enjoyed watching it. I have gathered enough\ninformation and material to work with. The only hard part is who do I start with – they’re all\ngame and interesting enough to mess with. Maybe I will start with Rich, for the loud YES! It\nis true I really DON’T like to be disturbed. The game is fun; the noises are not! I will enjoy\nthis, I will disturb them, the way they have disturbed me! Let the HAUNTING begin!","wela":"Jose Ramirez\nProf. Jessica Goldschmidt\nENG 1141\n10/9/2026\n\n                                         Wondering Wela\n\n        The day is typical for early fall; the warmth of the summer hasn’t fully escaped us but\nwe’ve yet to return to standard time. It’s Friday, and we’re just ending the school week. As if it\nwere my duty, I rush through my homework to go outside. “Your father is going to talk to you\nlater,” my mother says before I step out the door. Not fully concerned, but curiosity slows me\ndown. Talk to me about what? I don’t ask; I let the words slip by, maybe it’s not too bad, if it is,\nmaybe he’ll forget. “Oh, okay,” I say abruptly as I make my exit. My father would come by\naround 4:00 PM every school day to see my brothers and me; today is no different; here he is, in\nhis blue Denali.\n\n        He doesn’t seem very happy.\n        “Jun, come inside. Jose, Will… go upstairs, I’ll call you down in a bit,” he says as our\nbodies hang over his open car windows.\n        The windows come up as I shut the door behind me and I hear the doors lock. This is\ngoing to be a serious conversation.\n        “Your mother tells me you kicked the lady’s trash over, across the street…”\n        “What lady?” I reply.\n        “Jun. Don’t play. You’re 14, not a child anymore. You tell me what lady.”\n        “I… uh. I don’t…” I stammer.\n        “You do know all the parents on this block talk to each other, right? Even though I don’t\nlive here anymore, they still tell me everything – when it comes to you guys. I make sure they\ndo.”\n        “I’m sorry, pa. Everyone was doing it.”\n        “I don’t want to hear what everyone is doing,” he says. “We are talking about you.”\n        “Okay, Pa,” I surrender.\n        “How would you like it if someone did that to our house, and I had to clean it up?” he\ncontinues. “Or better yet, I had you clean it?”\n\n        I stare out the window. I already know this conversation isn’t going to leave any room for\nme to defend myself. I have no defense. Sometimes when my friends and I get together, we do\nstupid things. Boredom, maybe?\n\n        He goes on, “I better never hear of it again, your mother told me this time, but I’m going\nto knock on her door and make sure she has my number so she can call me directly if you step\nout of line. Any of you guys!”\n        “I want you to do something for me,” he states.\n        “What’s that?” I ask.\n        “I want you to pick somebody. Anybody. It could be family; it doesn’t have to be. Pick\nsomebody you love, someone you have admiration for whose respect you’d never want to lose.\nTake a minute.”\n\n        He leaves me time to think, but I’ve already chosen his mother, my grandmother. She is\neasily the obvious choice. She is the matriarch of our family, the one who holds the recipes, the\none that encourages everyone to call one another, the one who hosts the sleepovers during family\nreunions. Every time we passed by to see her, we would have to pedir la bendición and then she\nwould give us her blessing. She always cooks for us and likes to surprise us with our favorite\nDominican dishes, like habichuela con dulce, or moro de coco. I let the quiet rest for a while; I\ndon’t want to disturb it or make the moment any more tense.\n\n         “Who’d you pick?” he asks.\n         “Wela.” I don’t have to specify which one. He must know I’d pick her.\n         “Ok. I want you to – next time you are out here and thinking about doing anything\nquestionable – I want you to think of your grandmother. I want you to imagine she was turning\nthe corner or entering the room as you’re doing whatever it is that you’re thinking about doing.”\nHe continues, “I want you to imagine her catching you in the act and how that would make her\nfeel, to see you kicking over the neighbors’ trash can. Or whatever else it is that you’re doing out\nhere.”\n         “Does that make you feel good?” he asks.\n         “No…”\n         “That’s something to think about. Why doesn’t it feel good?”\n         Silence.\n         “That’s a question for you to answer,” he presses.\n         “I don’t know…” I reply.\n         “Because it’s something you know you shouldn’t be doing,” he finishes. After a quick\nmoment of silence, “Go upstairs, stay inside today, tell your brothers to come down.”\n         “Bye, Pa.” I open the door of the SUV to exit.\n         “Hey Jun.”\n         “Yeah, Pop?”\n         “I love you.”\n         “Love you too,” I respond as I step out, closing the door behind me.\n\n        This lecture felt like a normal lecture, like the kinds we’d get when we’d come home\nwith unfavorable grades, or if we made a mess in the house – but I had no idea that this thought\nexercise – his words and the image of my grandmother – would carry on the way it did. Carry on\nthrough years of growth, acting as a buffer to many of my decisions through life, especially as I\nexplored young adulthood. I am grateful for his words because they helped me practice self-\naccountability at times when I had no one to turn to and had to make decisions based on my own\njudgment. I’d just think, how would my grandmother feel about this decision? I couldn’t imagine\nletting her down. What would happen then, when I say bendición? Would she not reply, “Que\nDios te bendiga?”\n\n       “Jose. Will. Pops is calling for you.”","ark":"Jose Ramirez\nEng 1141\nProf. Goldschmidt\n9/10/2026\n\n\n                                   Into the Ark\n\n\n\nHere comes the tsunami\n\nBefore the flood arrives\n\nInto the ark…\n\n      All you movies and games\n\n      And all entertainment that helps me stay sane\n\n      All the days filled with random\n\n      Cars blasting music, like its their favorite anthem\n\n      Strangers interacting and smiling\n\n      That feeling you get when you go outside stylin’\n\n      The natural sense of surprise\n\n      The light shine upon your face as you watch the sunrise\n\n      All of your hopes and dreams\n\n      The hope that it’s true, everything isn’t what it seems\n\nHere comes the tsunami\n\nBefore the flood arrives\n\nInto the ark\n\nAll that makes you feel alive.","astral":"                                                                         Jose Ramirez\n                                                                   Prof. Goldschmidt\n                                                                             Eng 1141\n                                                                            9/21/2022\n                            Astral Dreams\n\n        I often think that multiple realities run in coexistence\n\n  Many realities in which we are present in an alternate experience\n\n               A different reality, a different dimension\n\n         But there we are, living there as a different person,\n\n    The us we would have been, had we made THAT other choice\n\n The choice where we decided to speak up, where we took a chance\n\n     Took that job, went to that school, asked that girl to dance\n\n  Every choice we didn’t make, that could have opened new paths\n\nOccurred in these realities, and we are there presenting in new masks\n\nSometimes we communicate with these other realms, it would seem\n\n       As we are given glimpses of these other lives in dreams\n\n  It has been more than fifteen years since I gave up my aspirations\n\n      And thirty years since I crawled into a play space station\n\n         But when I was young, I wanted to be an astronaut\n\n           Until high school, my grades said I ought to not\n\n        But recently I dreamed that I was aboard a spaceship\n\n                  A dream so vivid I can still taste it\n\n    The liquid meal with my crew I didn’t know would be my last\n\n    Some were dressed up, some dressed down, in gym apparel\n\n          Some in military uniform, commanders in battle\n\n            The vibe is chill, like the night’s winding down\n\n           Except for the uniformed people pacing around\n\n               I watched them; they seemed to be on high alert\n\n          I decided to turn toward my cabin, but he caught me first\n\n          “General, great job, today was a success, I’m turning in”\n\n   “Get dressed? Why? There are no tasks set for the rest of the evening”\n\n           “Oh, simulations? Sure, I’ll meet you in the ready room”\n\n              Seems urgent I guess I’d be best to get ready soon\n\n             I put on my astronaut gear and met with the general\n\n            I felt a bit anxious; I didn’t know what I was headed to\n\n                  In the ready room, with little conversation\n\n      He directed me as we walked together toward the docking station\n\n                 “Wait in here” he says, “standby for orders”\n\n           We’re in the middle of nowhere, suddenly I need water\n\n        First, I heard the buzzer, then the decompression at the hatch\n\n            I turned toward the exit and tried to reach for the latch\n\n           But it’s too late, like a vacuum, the deep consumed me\n\n                 Out of the ship, no O2 tank, no crew, just me\n\n                     It all happened so fast, this isn’t right\n\n             But it must have been the longest minute in my life\n\nI wrestled with the little oxygen in my suit until “CRACK!” There goes my mask\n\n          My consciousness fades away until I wake up with a gasp\n\n      I interpreted the dream as a look into a parallel realm of existence\n\n         Where on this very night, in that reality, in this very instance\n\n  I took my last breath, had I made THAT choice, had I gone down that line\n\n        I thanked God that we are always where we are meant to be,\n\n               and in this reality, he has granted me more time.","noah":"Jose Ramirez\nProf. Jessica Goldschmidt\nENG 1141\n9/12/2026\n\n                                     Noah’s Ark- The Poem\n\nI’m going to need a guiding light\n\nTo guide us through the dark\n\nFeels like it was only last night\n\nI had a dream about the Ark\n\n\n\nYes, the one with the animals in pairs\n\nThe one that survived the flood\n\nThere are so many things that we share\n\nDown to the DNA in our blood\n\n\n\nI’m new to this but so are you\n\nIn fact, I am much older\n\nI’ll do anything to get us through\n\nAnd you will always have my shoulder\n\n\n\nSo, listen here bears, tigers— and constricting boas\n\nMake some room in this Ark and welcome my son Noah.","heaven":"Heaven\n\n                 You wake up to notice all your windows are open\n\n         Look outside, the sky is light blue, clouds white and soft as cotton\n\n         You walk to the window to see an array of colorful buildings and\n\n                   Wow! Look at that! More clouds at the bottom\n\n                          No streets, no sidewalks, no cars\n\n                         No schools, no hospitals, no bars!\n\n                 Look out, here I come! “Hi, it’s nice to meet you”\n\n                 “Can you see me standing here at your window?”\n\n               “Come outside, no need to dress up, no need to walk\n\n                   I have a lot to tell you, prepare to be shocked\n\n                      Off we go, in flight, to explore heaven”\n\n\n                                  Heaven II\n\n              You wake up to notice all your windows are open\n\n                  The clock isn’t ticking, perhaps it’s broken\n\n             Look outside, blue skies, white clouds, soft as cotton\n\n         You walk to the window to an array of colorful buildings and\n\n                Wow! Look at that! More clouds at the bottom\n\n                       No streets, no sidewalks, no cars\n\n                      No schools, no hospitals, no bars!\n\n              “Look out, here I come! Hi, it’s nice to meet you”\n\n              “Can you see me standing here at your window?”\n\n                  “You must be wondering how am I flying”\n\n                    “You can too, if I’m lying, I’m dying”\n\n                      “Hah! Too late! Don’t you get it?”\n\n              Come outside, so I can show you around heaven”","rapture":"Into the Ark\n\n\n\nHere comes the tsunami\n\nBefore the flood arrives\n\nInto the ark…\n\n       All you movies and games\n\n       And all entertainment that helps me stay sane\n\n       All the days filled with random\n\n       Cars blasting music, like its their favorite anthem\n\n       Strangers interacting and smiling\n       That feeling you get when you go outside stylin’\n\n       The natural sense of surprise\n\n       The light shine upon your face as you watch the sunrise\n\n       All of your hopes and dreams\n\n       The hope that it’s true, everything isn’t what it seems\n\nHere comes the tsunami\n\nBefore the flood arrives\n\nInto the ark\nAll that makes you feel alive.\n\n\n                        Noah’s Ark- The Poem\n\n\n                    I’m going to need a guiding light\n                      To guide us through the dark\n                     Feels like it was only last night\n                      I had a dream about the Ark\n\n\n                  Yes, the one with the animals in pairs\n                     The one that survived the flood\n                 There are so many things that we share\n                     Down to the DNA in our blood\n\n\n                     I’m new to this but so are you\n                        In fact, I am much older\n                    I’ll do anything to get us through\n                 And you will always have my shoulder\n\n\n           So, listen here bears, tigers— and constricting boas\n         Make some room in this Ark and welcome my son Noah.\n\n\nAstral Dreams\n\n\nI often think that multiple realities run in coexistence\nMany realities in which we are present in an alternate experience\nA different reality, a different dimension\nBut there we are, living there as a different person,\nThe us we would have been, had we made THAT other choice\nThe choice where we decided to speak up, where we took a chance\nTook that job, went to that school, asked that girl to dance\nEvery choice we didn’t make, that could have opened new paths\nOccurred in these realities, and we are there presenting in new masks\nSometimes we communicate with these other realms, it would seem\nAs we are given glimpses of these other lives in dreams\nIt has been more than fifteen years since I gave up my aspirations\nAnd thirty years since I crawled into a play space station\nBut when I was young, I wanted to be an astronaut\nUntil high school, my grades said I ought to not\nBut recently I dreamed that I was aboard a spaceship\nA dream so vivid I can still taste it\nThe liquid meal with my crew I didn’t know would be my last\nSome were dressed up, some dressed down, in gym apparel\nSome in military uniform, commanders in battle\nThe vibe is chill, like the night’s winding down\nExcept for the uniformed people pacing around\nI watched them; they seemed to be on high alert\nI decided to turn toward my cabin, but he caught me first\n“General, great job, today was a success, I’m turning in”\n“Get dressed?
