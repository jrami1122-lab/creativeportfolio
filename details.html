<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Detailed project profiles, books and original creative work by Jose W. Ramirez."><title>Project Details — Jose W. Ramirez</title><style>:root{--bg:#f9faf8;--ink:#162942;--muted:#617080;--green:#27675a;--gold:#b67a32;--line:#e2e5e8;--soft:#edf3ef}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:3px}.wrap{max-width:1040px;margin:auto;padding:0 25px}header{background:#f9faf8ed;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}header .wrap{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:800}.brand small{display:block;font-size:.68rem;color:var(--green);letter-spacing:.13em;text-transform:uppercase}nav{display:flex;gap:14px;flex-wrap:wrap}nav a{color:var(--muted);font-size:.84rem;font-weight:700}h1,h2{font-family:Georgia,serif;letter-spacing:-.04em;line-height:1.14;font-weight:500}h1{font-size:clamp(2.65rem,6vw,4.5rem);margin:8px 0 18px}h2{font-size:2rem;margin:12px 0 16px}.eyebrow{font-size:.73rem;letter-spacing:.15em;text-transform:uppercase;color:var(--green);font-weight:800}.hero{padding:65px 0 45px;display:grid;grid-template-columns:1fr .8fr;gap:40px;align-items:center}.hero p{font-size:1.13rem;color:var(--muted)}.art{width:100%;max-height:450px;object-fit:cover;border-radius:23px;border:1px solid var(--line);box-shadow:0 15px 30px #1c31410d}.book-art{min-height:340px;display:grid;place-items:center;padding:30px;text-align:center;border-radius:23px;border:1px solid var(--line);background:linear-gradient(150deg,#edf3ef,#f7e9d6);font:italic 2.4rem Georgia,serif}.status{display:inline-block;color:var(--green);font-size:.78rem;font-weight:800;padding:7px 12px;border-radius:30px;background:#e9f2ea}.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:25px}.btn{border:1px solid var(--green);padding:10px 17px;border-radius:30px;font-weight:750;font-size:.9rem;color:var(--green)}.btn.primary{background:var(--green);color:white}.section{border-top:1px solid var(--line);padding:42px 0}.section p{max-width:740px;color:var(--muted)}.section ul{color:var(--muted);padding-left:23px}.info{padding:24px;background:white;border:1px solid var(--line);border-radius:18px}.back{display:inline-flex;margin:35px 0 0;color:var(--green);font-size:.9rem;font-weight:800}.related{display:flex;gap:11px;flex-wrap:wrap}.related a{background:var(--soft);border-radius:12px;padding:11px 15px;font-size:.87rem;font-weight:750;color:var(--green)}footer{padding:38px 0;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted)}@media(max-width:720px){.hero{grid-template-columns:1fr}.wrap{padding:0 17px}.hero{padding:45px 0}.art{max-height:330px}header .wrap{flex-direction:column;align-items:start;padding:12px 17px;gap:7px}}</style></head><body><header><div class="wrap"><a href="index.html" class="brand">Jose W. Ramirez<small>Creative Portfolio</small></a><nav><a href="index.html#creative">Creative Work</a><a href="index.html#literary">Literary Works</a><a href="index.html#franchises">Franchises</a><a href="index.html#inventions">Inventions</a></nav></div></header><main class="wrap" id="app"></main><footer><div class="wrap">© 2026 Jose W. Ramirez · <a href="index.html">Return to portfolio</a></div></footer><script>
const projects={"n3":{"name":"Night Nurse Nightmare","category":"Game Design / Survival Horror","status":"Playable project in active development","image":"assets/n3-logo.webp","pitch":"A cooperative survival-horror nursing simulator in which patient care and teamwork matter as much as surviving the night.","about":"Night Nurse Nightmare (N3) puts players in charge of caring for patients during a supernatural emergency. Nursing objectives, hospital exploration, limited resources and an escalating haunting combine into a cooperative survival experience.","process":["Patient-care and critical-care minigames","Campaign/story and Endless Survival concepts","Online co-op and controller/mobile interaction design"],"links":[["View development repository","https://github.com/jrami1122-lab/Night-Nurse-Nightmare"]]},"airport":{"name":"Airport Frenzy","category":"Game Design / Party Games","status":"Interactive game project","pitch":"A collection of competitive and cooperative airport-ground-operation mini-games, designed with accessible party-game controls.","about":"Airport Frenzy brings ramp and airport tasks into a playful multiplayer environment. Design explorations include marshalling, cart handling, concessions and tournament-style scoring.","process":["Multiple minigames and tournament play","Controller and keyboard input","Co-op and competitive game-flow design"],"links":[["View project repository","https://github.com/jrami1122-lab/Airport-Frenzy-Online"]],"image":"assets/airport-thumbnail.webp?v=20261031-hq"},"flip":{"name":"Flip Cars","category":"Game Design / Racing","status":"Game project","pitch":"A tactical multiplayer racing experience in which timing, card effects and position reshape every race.","about":"Flip Cars combines racing with tabletop-inspired card decisions. The game explores movement, competitive positioning, hazards, pit stops and online/offline play.","process":["Card-based movement and racing rules","Multiplayer and split-play considerations","Menu and input design"],"links":[["View repository","https://github.com/jrami1122-lab/Flip-cars"]],"image":"assets/flip-cars-art.svg"},"bog":{"name":"Battle of the Gods","category":"Original Game Identity","status":"Creative development","image":"assets/bog-logo.webp","pitch":"A mythic game concept with a distinctive classical-gold visual identity.","about":"Battle of the Gods explores mythology-inspired competitive gameplay and the art direction of a collectible, expandable game world.","links":[["Battleboard portfolio","battleboard-portfolio.pdf"]]},"pondering":{"name":"Coquí: Pondering Humanity","category":"Interactive Animated Story","status":"Interactive experience available","pitch":"A curious coquí considers human life in an animated multimedia poem.","about":"An independent visual poem blending character animation, playful observation and mini-game-like interaction. This is separate from the Coquí & Tito franchise.","links":[["Open interactive experience","coqui-what-is-it-like-to-be-human.html"]],"image":"assets/pondering-art.webp"},"coqui":{"name":"Coquí & Tito","category":"Original Franchise","status":"Story and game franchise","image":"assets/coqui-logo.webp","pitch":"A family-oriented transmedia adventure bringing an unlikely animal duo to children’s books, animation and interactive games while encouraging curiosity about nature.","about":"Created as an expandable children’s entertainment property, Coquí & Tito pairs a Puerto Rican coquí frog with a Galápagos tortoise. The world blends friendship, wildlife, environmental themes and humor across illustrated stories, animation and playable experiences. Save the World introduces the characters through video, while Battlegrounds translates their adventures into competitive tabletop and web gameplay.","process":["Original children’s-series world and characters","Coquí & Tito: Battlegrounds game concept","Potential children’s book and animation extensions"],"links":[["Watch Coquí & Tito video","https://www.youtube.com/watch?v=-CpFCoKeZT8"],["Official Coquí & Tito website","https://www.coquitito.com/"],["Shop Coquí & Tito books","https://www.amazon.com/dp/B0F59GY27Z"],["Play Battlegrounds web beta","https://de8afbcc-9cb3-4a8a-bd25-ed9d18230ce3-00-u3evdyqqtwn.worf.replit.dev"],["Battleboard portfolio","battleboard-portfolio.pdf"]],"youtube":"-CpFCoKeZT8"},"ninjas":{"name":"Ninjas Con Salsa","category":"Original Franchise","status":"Franchise and game development","image":"assets/ninjas-logo.webp","pitch":"An action-oriented universe about a returning serviceman who opens a ninja school to help younger people find a different path.","about":"Ninjas Con Salsa is conceived as a character-driven action-comedy franchise for animated shorts, serialized storytelling and arcade-style games. A returning serviceman channels his experience into a ninja school, offering young people mentorship and a sense of belonging. Its mix of martial-arts humor, cultural personality and playable characters supports expansion across screens and interactive media.","process":["Character and story-world development","Ninjas Con Salsa: Battlegrounds concepts","Animation and arcade prototypes"],"links":[["Watch Ninjas Con Salsa video","https://www.youtube.com/watch?v=FW9nlycuzRI"],["Battleboard portfolio","battleboard-portfolio.pdf"]],"youtube":"FW9nlycuzRI"},"aim":{"name":"AIM","category":"Science-Fiction Book & Franchise","status":"Book available on Amazon · Original franchise","image":"assets/aim-cover.webp","pitch":"An original science-fiction universe developed through futuristic character design, narrative concepts and the AIM-47: Legacy Lives visual identity.","about":"AIM appears across the literary portfolio and the AIM-47 franchise concept. The supplied Legacy Lives artwork introduces a futuristic figure and surrounding world; the book has a creator-supplied Amazon listing. This page provides a portfolio overview rather than reproducing the retailer's complete description.","process":["Original science-fiction storytelling","AIM-47 Legacy Lives concept imagery","AIM: Battlegrounds planned within the Battleboard universe"],"links":[["View AIM-47: Legacy Lives on Amazon","https://www.amazon.com/dp/B0F8C44XQV"],["Watch AIM-47 video","#video"],["AIM-47 franchise artwork","assets/aim-cover.webp"],["Battleboard portfolio","battleboard-portfolio.pdf"]],"purchase":"Amazon book listing supplied by the creator. Format, pricing and current availability are determined by Amazon.","localVideo":"assets/aim-trailer.mp4"},"ascension":{"name":"Ascension / The Fall","category":"Illustration / Visual Poetry","status":"Illustrated experience available","pitch":"A two-part hand-drawn visual poem about ascent, descent, faith and perspective.","about":"The artwork travels upward from streets, oceans and cities toward the sky and beyond, while the companion side reverses the perspective.","links":[["Open both original illustrations","ascension.html"],["View Only Up illustration","ascension.html#ascension"],["View The Fall illustration","ascension.html#fall"]],"image":"assets/ascension-art.webp"},"cinco":{"name":"Cinco Generaciones","category":"Original Illustration","status":"Artwork and sketch","pitch":"A family portrait celebrating the relationships and connections across five generations.","about":"The finished illustration and line-art sketch present a multi-generational family gathering and the drawing process behind it. Gallery integration of the separate original image files is being curated.","links":[["Browse Illustration Gallery","work.html#illustrations"]],"image":"assets/cinco-thumbnail.webp?v=20261031-hq"},"ouija":{"name":"The Ouija","category":"Short Horror Story","status":"Full short edition available to read","pitch":"A group of friends tries a Ouija board; their night ends, but one unseen observer is not finished with them.","about":"A supernatural short story that mixes nervous banter, a dimly lit cellar and a chilling shift in narrative point of view.","links":[["Read the complete submitted story","read.html?piece=ouija"]],"image":"assets/ouija-thumbnail.webp?v=20261031-hq"},"wela":{"name":"Wondering Wela","category":"Short Fiction","status":"Complete submitted story available to read","pitch":"A teenager discovers how a father’s lesson about his grandmother’s respect can guide decisions long after childhood.","about":"In Wondering Wela, a father uses a lesson about the respect and love the narrator holds for his grandmother to teach self-accountability. The full submitted story is available to read here.","links":[["Read Wondering Wela","read.html?piece=wela"]],"image":"assets/wela-thumbnail.webp?v=20261031-hq"},"ark":{"name":"Into the Ark","category":"Poem","status":"Available to read","pitch":"A poetic inventory of the moments and experiences worth saving.","about":"A poem about the ordinary pleasures, hopes, dreams and surprises we carry forward.","links":[["Read original poem","read.html?piece=ark"]],"image":"assets/ark-thumbnail.webp?v=20261031-hq"},"noah":{"name":"Noah’s Ark","category":"Poem","status":"Available to read","pitch":"A guiding-light poem that connects the ark story with care and protection for a child.","about":"Part of the A Journey Through the Rapture poetry collection.","links":[["Read original poem","read.html?piece=noah"]],"image":"assets/noah-thumbnail.webp?v=20261031-hq"},"astral":{"name":"Astral Dreams","category":"Poem","status":"Available to read","pitch":"A meditation on other realities and the lives our unmade choices might have created.","about":"A vivid dream of space travel becomes a reflection on parallel possibilities, fate and gratitude.","links":[["Read original poem","read.html?piece=astral"]],"image":"assets/astral-thumbnail.webp?v=20261031-hq"},"heaven":{"name":"Heaven II","category":"Poem","status":"Available to read","pitch":"Two poetic glimpses of an imagined journey through heaven.","about":"An imagined journey through heaven, exploring wonder, flight and a transformed world.","links":[["Read the poems","read.html?piece=heaven"]],"image":"assets/ascension-art.webp"},"encrypt3d":{"name":"Tales from the Encrypt3d","category":"Story Collection / Techno-Horror","status":"Published book listing on Amazon","pitch":"What happens when a game does not end when the screen goes dark?","about":"A collection of high-stakes stories exploring games, codes and digital systems that begin to affect the physical world. In the available manuscript, a deadly phone-based game can pass from one person to another, and another game blurs the line between simulated threats and real consequences. This description is a portfolio synopsis, not published back-cover text.","process":["Original digital-horror story concepts","Game rules used as suspense mechanisms","Stories about the collision of online and offline worlds"],"links":[["View Tales from the EnCRYPT3D on Amazon","https://www.amazon.com/dp/B0FDLG3SW2"],["Browse Literary Works","literary.html#books"]],"purchase":"Amazon ebook listing supplied by the creator. Check Amazon for current editions, prices and availability.","image":"assets/encrypt3d-thumbnail.webp?v=20261031-hq"},"coqui-books":{"name":"Coquí & Tito Children’s Books","category":"Children’s Book Series","status":"Series project · Official shop links available","image":"assets/coqui-logo.webp","pitch":"Two unlikely animal companions discover that the biggest adventures are easier when you face them together.","about":"Coquí the frog and Tito the Galápagos tortoise share a world of animal allies, predators and environmental challenges. The books belong to the same original family-friendly franchise as the Battlegrounds game. This is a portfolio synopsis, not a verified back-cover quotation.","links":[["View Coquí & Tito books on Amazon","https://www.amazon.com/dp/B0F59GY27Z"],["Official Coquí & Tito website","https://www.coquitito.com/"],["Mixam shop linked by official website","https://mixam.com/print-on-demand/68981f0f98112b5bbce4e316"],["Official Coquí & Tito website","https://www.coquitito.com/"]],"purchase":"The official Coquí & Tito website lists children’s book shop links. Product and checkout availability should be confirmed with the seller."},"rapture":{"name":"A Journey Through the Rapture","category":"Poetry Collection","status":"Available manuscript selections","pitch":"A collection of reflective poetry about hope, dreams, faith and the worlds we imagine.","about":"The available reading library includes Into the Ark, Noah’s Ark, Astral Dreams, Heaven and Heaven II.","links":[["Read the available collection","read.html?piece=rapture"]],"purchase":"Available to read on this website; a public purchase listing has not been verified.","image":"assets/ascension-art.webp"},"battleboard":{"name":"Battleboard","category":"Invention / Modular Tabletop Platform","status":"Physical prototype and game portfolio","pitch":"One modular board, many different games.","about":"Battleboard unfolds into five square spaces for interchangeable tiles. Each game has its own rules, characters, components and visual identity, allowing a reusable tabletop platform to host multiple kinds of play.","process":["Physical five-zone modular board design","Interchangeable game tiles","Platform concepts spanning free-roam, linear and staged game modes"],"links":[["View Battleboard portfolio (PDF)","battleboard-portfolio.pdf"],["Play Coquí & Tito: Battlegrounds","https://de8afbcc-9cb3-4a8a-bd25-ed9d18230ce3-00-u3evdyqqtwn.worf.replit.dev"],["Additional platform games","details.html?project=battleboard-roadmap"]],"image":"assets/battleboard-art.webp"},"coqui-battlegrounds":{"name":"Coquí & Tito: Battlegrounds","category":"Battleboard Platform Game","status":"Play-tested project","image":"assets/coqui-logo.webp","pitch":"The first Battleboard game brings Coquí & Tito characters into two-to-four-player competition.","about":"Based on the original children’s-series franchise, Battlegrounds uses tiles, cards, dice and tokens. The gameplay supports free-for-all or team matchups, with a portable cards-and-dice format for play away from the board. The game is identified in the Battleboard portfolio as the first game that inspired the platform design.","links":[["Play Battlegrounds web beta","https://de8afbcc-9cb3-4a8a-bd25-ed9d18230ce3-00-u3evdyqqtwn.worf.replit.dev"],["View concept portfolio (PDF)","battleboard-portfolio.pdf"],["Coquí & Tito official website","https://www.coquitito.com/"]]},"battleboard-roadmap":{"name":"Battleboard Games & Roadmap","category":"Game System / Portfolio","status":"Mix of play-tested ideas and concepts in development","pitch":"A growing range of games designed around a common interchangeable physical platform.","about":"The Battleboard portfolio showcases Coquí & Tito: Battlegrounds, Ninjas Con Salsa: Battlegrounds, AIM: Battlegrounds, Graffiti Warz, Conquer Royale, Stackblocks, Battle of the Gods and additional experiments. Some have been play-tested while others are in development; the portfolio identifies individual statuses.","links":[["Open Battleboard portfolio (PDF)","battleboard-portfolio.pdf"]]},"e-battleboard":{"name":"Electronic Battleboard","category":"Future Product Concept","status":"Concept / future development","pitch":"An exploration of bringing a modular physical board system into an electronic format.","about":"Electronic Battleboard is a proposed future direction rather than a publicly confirmed finished product. It extends the original idea of a reusable game platform.","links":[["Explore physical Battleboard","details.html?project=battleboard"],["View portfolio PDF","battleboard-portfolio.pdf"]]}};
